name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README claims. 3.12 is here so that a
        # deprecation lands in CI rather than on a reviewer's machine.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: No dependencies to install
        run: |
          echo "Standard library only. If this step ever needs to change,"
          echo "the README claim that the package has no dependencies is wrong."
          test ! -f requirements.txt

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Run the demo end to end
        run: python demo.py > /dev/null

      - name: Verify the public-data example
        run: python -m examples.amsterdam_noise

      - name: Run the search analysis
        # Every number in the "Measuring the search" section of the README is
        # printed by this script, and the README tells the reader to run it.
        # About 11 seconds.
        run: python analysis.py > /dev/null

  ontology-cross-check:
    name: the ontology against a real RDF parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[check]'
      - name: The rdflib comparison must actually run here, not skip
        # The dependency-free reader agreeing with itself proves nothing. This
        # job exists so the comparison against rdflib cannot quietly disappear
        # the way an optional test does on a machine that lacks the package.
        run: |
          python -m unittest tests.test_owl -v 2>&1 | tee owl.txt
          if grep -q "skipped" owl.txt; then
            echo "The rdflib cross-check skipped in the job that exists to run it."
            exit 1
          fi

  gis:
    name: GIS backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the GIS extra
        run: python -m pip install '.[gis]'
      - name: Check the installed backend
        run: python -I -c "from typed_workflow_layer.gis_backend import RasterPolygonBackend"
      - name: Check parity, edge cases and the polygon reference
        run: python -m unittest tests.test_gis_backend -v
      - name: Run the published polygon example
        run: python -m examples.amsterdam_polygons
      - name: Check the benchmark and ranking import
        run: python -m unittest tests.test_workflow_benchmark -v
      - name: Print the published scorecard
        run: python -m examples.workflow_benchmark

  wheel:
    name: installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
      - name: Import from outside the checkout
        run: |
          cd /tmp
          python -c "import ccd, owl; assert owl.load(); print(owl.ONTOLOGY_PATH)"
